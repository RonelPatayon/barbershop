      <!-- Login Form -->
      <form id="loginForm" autocomplete="off">
        <div class="form-group">
          <label for="username">Username</label>

            <input type="text" id="username" placeholder="Enter your username" required autocomplete="off">

        <div class="form-group">

  <script>
    // Toggle password visibility
       // Toggle password visibility
    document.getElementById('togglePassword').addEventListener('click', function(e) {
      e.preventDefault();
      
      const passwordInput = document.getElementById('password');
      const icon = this.querySelector('i');
      
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        icon.className = 'fas fa-eye-slash';
      } else {
        passwordInput.type = 'password';
        icon.className = 'fas fa-eye';
      }
      
      // Refocus the input after toggling
      passwordInput.focus();
    });

    // Show error
    function showError(message) {
      const errorDiv = document.getElementById('errorMessage');
      const errorText = document.getElementById('errorText');
      errorText.textContent = message;
      errorDiv.classList.add('show');
      
      // Hide after 5 seconds
      setTimeout(() => {
        errorDiv.classList.remove('show');
      }, 5000);
    }

    // Hide error
    function hideError() {
      document.getElementById('errorMessage').classList.remove('show');
    }

    // Set loading state
    function setLoading(loading) {
      const btn = document.getElementById('loginBtn');
      if (loading) {
        btn.classList.add('loading');
        btn.disabled = true;
      } else {
        btn.classList.remove('loading');
        btn.disabled = false;
      }
    }

    // Handle login
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      hideError();

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const remember = document.getElementById('rememberMe').checked;

      if (!username || !password) {
        showError('Please enter both username and password.');
        return;
      }

      setLoading(true);

      try {
        const response = await fetch('api/auth/login.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password, remember })
        });

        const data = await response.json();

        if (data.success) {
          // Success - redirect to dashboard
          Swal.fire({
            icon: 'success',
            title: 'Welcome back!',
            text: `Logged in as ${data.user.name || username}`,
            timer: 1500,
            showConfirmButton: false
          }).then(() => {
            window.location.href = data.redirect || 'dashboard.php';
          });
        } else {
          showError(data.message || 'Invalid username or password.');
          setLoading(false);
        }
      } catch (error) {
        console.error('Login error:', error);
        showError('Network error. Please check your connection and try again.');
        setLoading(false);
      }
    });

    // Forgot password
    function forgotPassword() {
      Swal.fire({
        title: 'Forgot Password?',
        text: 'Please contact the system administrator to reset your password.',
        icon: 'info',
        confirmButtonColor: '#1e2a3a',
        confirmButtonText: 'OK'
      });
    }

    // Focus first input
    document.getElementById('username').focus();
  </script>
